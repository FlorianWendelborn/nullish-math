name: Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: test
        run: bun test

      - name: build
        run: bun run build

      - name: dry-publish
        run: npm publish --provenance --dry-run
